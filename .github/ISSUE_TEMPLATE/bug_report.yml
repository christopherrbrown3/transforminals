name: Bug report
description: Report a reproducible gameplay, browser, save, or deployment problem.
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include what you expected to happen and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open ... 2. Tap ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPad, or Chromium on macOS
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add console output, screenshots, or a Playwright run link if available.
